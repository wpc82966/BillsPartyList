<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f6f3;--surface:#fff;--surface-alt:#f1efe8;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);
  --text:#1a1a1a;--text-sec:#5f5e5a;--text-tri:#888780;
  --primary:#1f4e78;--success:#3b6d11;--warning:#854f0b;--warning-bg:#faeeda;--danger:#a32d2d;--info:#185fa5;--info-bg:#e6f1fb
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1b18;--surface:#26251f;--surface-alt:#2c2c2a;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.25);--text:#f1efe8;--text-sec:#b4b2a9;--text-tri:#888780;--info-bg:#0c447c;--warning-bg:#633806}
}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:12px;padding-bottom:80px}
.head{padding:8px 4px 6px}
.title{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{font-size:12px;color:var(--text-sec);margin:0}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sec);margin:10px 0 4px;font-variant-numeric:tabular-nums}
.prog-bar{height:6px;background:var(--surface-alt);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--info);transition:width .25s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-sec);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip-badge{font-size:11px;background:var(--surface-alt);color:var(--text-sec);padding:1px 7px;border-radius:999px}
.chip.active .chip-badge{background:rgba(255,255,255,.2);color:#fff}
.chip.done{opacity:0.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.store-name{font-size:17px;font-weight:600;margin:0 0 4px}
.store-note{font-size:12.5px;color:var(--text-sec);margin:0 0 10px}
.alert{background:var(--warning-bg);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--warning);margin-bottom:10px;line-height:1.4}
.stats{display:flex;gap:8px;margin-bottom:8px}
.stat{flex:1;background:var(--surface-alt);border-radius:10px;padding:9px 10px}
.stat-l{font-size:11px;color:var(--text-sec);margin:0}
.stat-v{font-size:15px;font-weight:600;margin:2px 0 0;font-variant-numeric:tabular-nums}
.item{border-top:1px solid var(--border);padding:11px 0}
.item:first-of-type{border-top:none}
.row{display:flex;align-items:flex-start;gap:11px;cursor:pointer}
.cb{flex-shrink:0;width:26px;height:26px;border:2px solid var(--border-strong);border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;font-weight:bold;cursor:pointer;transition:all .15s}
.cb.checked{background:var(--success);border-color:var(--success);color:#fff}
.main{flex:1;min-width:0}
.name{font-size:14.5px;line-height:1.35;word-wrap:break-word}
.done .name{text-decoration:line-through;color:var(--text-tri)}
.meta{font-size:12px;color:var(--text-sec);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta strong{color:var(--text);font-weight:600}
.tag{display:inline-block;background:var(--info-bg);color:var(--info);font-size:10px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:600}
.exp{margin-top:10px;padding:11px;background:var(--surface-alt);border-radius:10px;display:none}
.open .exp{display:block}
.notes{font-size:12.5px;color:var(--text-sec);margin:0 0 10px;white-space:pre-line;line-height:1.5}
.edits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.edits label{font-size:11px;color:var(--text-sec);display:block;margin-bottom:3px}
input[type=text],input[type=number]{width:100%;padding:9px 10px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;-webkit-appearance:none}
input:focus{outline:none;border-color:var(--info)}
.del{font-size:12.5px;color:var(--danger);background:none;border:none;cursor:pointer;padding:5px 0}
.add-row{padding:13px;text-align:center;border-top:1px dashed var(--border-strong);margin-top:4px;cursor:pointer;color:var(--info);font-size:13px;font-weight:500}
.add-form{padding:12px;background:var(--surface-alt);border-radius:10px;margin-top:8px;display:none}
.add-form.open{display:block}
.add-form input{margin-bottom:7px}
.add-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;font-weight:500}
button:active{transform:scale(.97)}
.add-form button{width:100%;margin-top:7px;color:var(--info);border-color:var(--info)}
.foot{display:flex;gap:8px;margin-top:14px}
.foot button{flex:1;color:var(--text-sec)}
.grand{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
.gr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.gr .r{font-variant-numeric:tabular-nums}
.gr.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;font-size:16px;font-weight:600}
</style>

let DATA=null,active=null,openKey=null,showAdd=false;
const $=id=>document.getElementById(id);
const fmt=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const freshDef=()=>{const d=JSON.parse(JSON.stringify(DATA_DEF));d.stores.forEach(s=>s.items.forEach(i=>i.done=false));return d;};

function loadData(){
  let stored=null;
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)stored=JSON.parse(raw);}catch(e){}
  if(!stored){DATA=freshDef();return;}
  DATA=freshDef();
  const byId={},stMap={};
  (stored.stores||[]).forEach(s=>{stMap[s.id]=s;(s.items||[]).forEach(it=>{if(it.id)byId[it.id]={item:it,storeId:s.id};});});
  const consumed=new Set();
  DATA.stores.forEach(ds=>{
    ds.items.forEach(di=>{
      const m=byId[di.id];if(!m)return;
      if(m.storeId!==ds.id){di.done=!!m.item.done;}
      else{if(m.item.qty!==undefined)di.qty=m.item.qty;if(m.item.price!==undefined)di.price=m.item.price;di.done=!!m.item.done;}
      consumed.add(di.id);
    });
  });
  DATA.stores.forEach(ds=>{
    const ss=stMap[ds.id];if(!ss)return;
    ds.items.forEach(di=>{
      if(consumed.has(di.id))return;
      const m=(ss.items||[]).find(it=>it.name===di.name&&!(it.id&&consumed.has(it.id)));
      if(m){if(m.qty!==undefined)di.qty=m.qty;if(m.price!==undefined)di.price=m.price;di.done=!!m.done;if(m.id)consumed.add(m.id);}
    });
  });
  (stored.stores||[]).forEach(ss=>{
    (ss.items||[]).forEach(it=>{
      if(it.id&&consumed.has(it.id))return;
      let tgt=DATA.stores.find(s=>s.id===ss.id);
      if(!tgt)tgt=DATA.stores.find(s=>s.id==='wm')||DATA.stores[0];
      if(tgt.items.find(d=>d.name===it.name))return;
      tgt.items.push({id:it.id||('user-'+Math.random().toString(36).slice(2,8)),name:it.name,qty:it.qty,unit:it.unit,notes:it.notes,price:it.price,done:!!it.done});
    });
  });
  saveData();
}

function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA));}catch(e){}}

function tot(s){let t=0,d=0,dt=0;s.items.forEach(it=>{const sub=(Number(it.qty)||0)*(Number(it.price)||0);t+=sub;if(it.done){d++;dt+=sub;}});return{total:t,done:d,dt:dt,count:s.items.length};}
function gtot(){let t=0,d=0,dt=0,c=0;DATA.stores.forEach(s=>{const x=tot(s);t+=x.total;d+=x.done;dt+=x.dt;c+=x.count;});return{total:t,done:d,dt:dt,count:c};}

function renderChips(){
  const el=$('chips');el.innerHTML='';
  DATA.stores.forEach(s=>{
    const t=tot(s);const rem=t.count-t.done;
    const c=document.createElement('div');
    c.className='chip'+(s.id===active?' active':'')+(rem===0?' done':'');
    c.innerHTML=`${esc(s.short)} <span class="chip-badge">${rem}</span>`;
    c.onclick=()=>{active=s.id;openKey=null;showAdd=false;render();window.scrollTo({top:0,behavior:'smooth'});};
    el.appendChild(c);
  });
}

function renderStore(){
  const v=$('view');
  const s=DATA.stores.find(x=>x.id===active);
  if(!s){v.innerHTML='';return;}
  const t=tot(s);
  const items=s.items.map((it,i)=>{
    const sub=(Number(it.qty)||0)*(Number(it.price)||0);
    const k=`${s.id}-${i}`;const isO=openKey===k;
    const tag=(it.notes||'').startsWith('MOVED FROM')?'<span class="tag">moved</span>':'';
    return `<div class="item ${it.done?'done':''} ${isO?'open':''}">
<div class="row">
<div class="cb ${it.done?'checked':''}" data-a="check" data-k="${k}">✓</div>
<div class="main" data-a="toggle" data-k="${k}">
<div class="name">${esc(it.name)}${tag}</div>
<div class="meta"><span><strong>${it.qty}</strong> ${esc(it.unit||'')}</span><span>@ ${fmt(it.price)}</span><span><strong>${fmt(sub)}</strong></span></div>
</div></div>
<div class="exp">
${it.notes?`<p class="notes">${esc(it.notes)}</p>`:''}
<div class="edits">
<div><label>Qty</label><input type="number" inputmode="decimal" step="0.01" value="${it.qty}" data-a="qty" data-k="${k}" /></div>
<div><label>Price each</label><input type="number" inputmode="decimal" step="0.01" value="${it.price}" data-a="price" data-k="${k}" /></div>
</div>
<button class="del" data-a="del" data-k="${k}">🗑 Remove from list</button>
</div></div>`;
  }).join('')||'<div style="padding:20px;text-align:center;color:var(--text-tri)">No items.</div>';
  v.innerHTML=`<div class="card">
<h2 class="store-name">${esc(s.name)}</h2>
<p class="store-note">${esc(s.note)}</p>
${s.alert?`<div class="alert">⚠ ${esc(s.alert)}</div>`:''}
<div class="stats">
<div class="stat"><p class="stat-l">Items</p><p class="stat-v">${t.done} / ${t.count}</p></div>
<div class="stat"><p class="stat-l">Picked up</p><p class="stat-v">${fmt(t.dt)}</p></div>
<div class="stat"><p class="stat-l">Store total</p><p class="stat-v">${fmt(t.total)}</p></div>
</div>
${items}
<div class="add-row" data-a="add-toggle">+ Add an item</div>
<div class="add-form ${showAdd?'open':''}">
<input type="text" placeholder="Item name" id="n-name" />
<div class="row2"><input type="number" inputmode="decimal" step="0.01" placeholder="Qty" id="n-qty" value="1" /><input type="text" placeholder="Unit (ea, lb)" id="n-unit" /></div>
<input type="number" inputmode="decimal" step="0.01" placeholder="Price each" id="n-price" />
<input type="text" placeholder="Notes (optional)" id="n-notes" />
<button data-a="add-save">+ Add item</button>
</div></div>
<div class="grand">
${DATA.stores.map(x=>{const st=tot(x);return `<div class="gr"><span>${esc(x.short)} <span style="color:var(--text-tri)">(${st.done}/${st.count})</span></span><span class="r">${fmt(st.total)}</span></div>`;}).join('')}
<div class="gr tot"><span>Grand total</span><span class="r">${fmt(gtot().total)}</span></div>
<div class="gr" style="font-size:12px;color:var(--text-sec);padding-top:4px"><span>Net after $300 HD credit</span><span class="r">${fmt(Math.max(0,gtot().total-300))}</span></div>
</div>`;
}

function renderProg(){
  const g=gtot();const p=g.count?(g.done/g.count*100):0;
  $('prog-l').textContent=`${g.done} of ${g.count} items`;
  $('prog-a').textContent=`${fmt(g.dt)} of ${fmt(g.total)}`;
  $('prog-f').style.width=p+'%';
}

function render(){renderChips();renderStore();renderProg();}

function findIt(k){const i=k.lastIndexOf('-');const sid=k.substring(0,i);const idx=parseInt(k.substring(i+1),10);const s=DATA.stores.find(x=>x.id===sid);return{s,it:s.items[idx],idx};}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,k=t.dataset.k;
  if(a==='check'){const{it}=findIt(k);it.done=!it.done;saveData();render();}
  else if(a==='toggle'){openKey=(openKey===k)?null:k;render();}
  else if(a==='del'){if(!confirm('Remove this item?'))return;const{s,idx}=findIt(k);s.items.splice(idx,1);openKey=null;saveData();render();}
  else if(a==='add-toggle'){showAdd=!showAdd;render();if(showAdd)setTimeout(()=>$('n-name')?.focus(),50);}
  else if(a==='add-save'){const name=$('n-name').value.trim();if(!name)return;const qty=parseFloat($('n-qty').value)||1;const unit=$('n-unit').value.trim()||'ea';const price=parseFloat($('n-price').value)||0;const notes=$('n-notes').value.trim();const s=DATA.stores.find(x=>x.id===active);s.items.push({id:'user-'+Math.random().toString(36).slice(2,8),name,qty,unit,price,notes,done:false});showAdd=false;saveData();render();}
});

document.addEventListener('change',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,k=t.dataset.k;
  if(a==='qty'){const{it}=findIt(k);it.qty=parseFloat(t.value)||0;saveData();render();}
  else if(a==='price'){const{it}=findIt(k);it.price=parseFloat(t.value)||0;saveData();render();}
});

$('reset-btn').addEventListener('click',()=>{if(!confirm('Reset everything to defaults?'))return;DATA=freshDef();active=DATA.stores[0].id;openKey=null;showAdd=false;saveData();render();});
$('uncheck-btn').addEventListener('click',()=>{DATA.stores.forEach(s=>s.items.forEach(it=>it.done=false));saveData();render();});

loadData();active=DATA.stores[0].id;render();
</script>
</body>
</html>
